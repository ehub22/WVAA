org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Keep AGP 8's DSL and the external Kotlin plugin until all Flutter plugins
# support AGP 9's new DSL and built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false

# Flutter release builds must not reuse output artifacts from an earlier CI run.
# The Gradle build cache (caches/build-cache-1) and the configuration cache can
# restore previously compiled Flutter/Android outputs and produce an APK that is
# identical to the old APK even when source code changed. Dependency downloads
# are still cached, which is where most of the build-time savings come from.
org.gradle.caching=false
org.gradle.configuration-cache=false
