name: Build Android APK + AAB

# When does this workflow run?
#   - on every push to the default branch (uploads an APK build artifact,
#     plus an AAB artifact when Play signing secrets are configured)
#   - on every pull request targeting the default branch (validates the build)
#   - when a version tag "vX.Y.Z" is pushed (creates a GitHub Release with the
#     APK, plus the AAB when Play signing secrets are configured)
#   - manually from the Actions tab (workflow_dispatch)
#
# Play Store signing: if the repository secrets KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEYSTORE_ALIAS, and KEYSTORE_KEY_PASSWORD are set, CI
# decodes the upload keystore, writes android/key.properties, and builds a
# signed AAB (flutter build appbundle) for upload to Play Console. Without
# those secrets the workflow behaves exactly as before: APK only, debug
# signing. See docs/PLAY_RELEASE.md.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# The token needs write access to upload artifacts and to create releases.
permissions:
  contents: write

# Cancel an in-progress build if a newer one for the same ref starts.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 21)
        # AGP 9.3.1 / Gradle 9.5.0 / Kotlin 2.4.20 require Java 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
        

      - name: Set up Flutter (latest stable)
        # pubspec.yaml requires Dart SDK >= 3.11.4, so we install the latest
        # stable Flutter channel, which always ships a compatible (newer) Dart.
        # For fully reproducible builds, pin a version, e.g. flutter-version: "3.32.0".
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # setup-android@v3 has no api-level/build-tools inputs; use `packages`.
          # Install both platforms/build-tools 35 and 36 so the build works whether
          # the installed Flutter targets compileSdk 35 or 36.
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.0
            build-tools;36.0.0

      # Fallback: make sure the required platforms/build-tools are present.
      - name: Ensure Android SDK packages are installed
        run: |
          set +e
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"
          set -e

      - name: Show Flutter version
        shell: bash
        run: |
          flutter --version | tee /tmp/versions.log
          python3 - "$(head -1 /tmp/versions.log)" <<'PY'
          import sys
          print(f"::notice title=Flutter::{sys.argv[1]}")
          PY

      # Cache Gradle downloads and wrapper files without caching `build-cache-1`.
      #
      # If `setup-gradle@v4` restores `caches/build-cache-1` from an earlier run,
      # Flutter's Gradle integration can reuse old compiled outputs and produce
      # an APK identical to the previous build even after Dart or Kotlin files
      # changed. Leaving `build-cache-1` out here (and disabling it in
      # android/gradle.properties) avoids stale APKs while still speeding up
      # dependency downloads.
      - name: Set up Gradle cache (dependencies only)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches/keyrings

      # Clear previous build outputs and Dart intermediates so CI never uploads
      # a leftover APK without wiping the Gradle dependency cache above.
      - name: Clean stale build outputs
        run: flutter clean


      - name: Get Flutter dependencies
        run: flutter pub get

      # Run the fast Python checks and unit tests before spending several minutes
      # on a full Gradle APK build.
      - name: Verify WCAG contrast of the theme
        run: python3 tools/audit_contrast.py --strict

      # `lib/l10n/strings.dart` is a large hand-edited Dart map where a missing
      # comma causes a vague Dart compiler failure later on, so check its
      # formatting and key parity directly first.
      - name: Check string translations
        run: python3 tools/check_strings.py

      - name: Run Flutter tests (includes the l10n/a11y suite)
        # Emit failures as GitHub annotations via `tools/annotate_ci.py` so
        # error details show up directly in the check-run API even when raw logs
        # are awkward to download.
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          status=$?
          python3 tools/annotate_ci.py /tmp/test.log test
          cat /tmp/test.log
          exit $status

      # Play Store upload signing (optional): decode the upload keystore from
      # secrets and write android/key.properties so Gradle signs release
      # builds with it (see android/app/build.gradle.kts). Skipped entirely
      # when secrets are not configured, preserving debug-signed sideloads.
      - name: Set up Play upload signing (if secrets configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_ALIAS" > android/key.properties
          chmod 600 android/key.properties
          echo "::notice title=Play signing::Upload keystore decoded; release builds will use Play upload signing."

      - name: Note Play signing status
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: echo "::notice title=Play signing::No KEYSTORE_BASE64 secret; AAB will be skipped and APK will use debug signing. See docs/PLAY_RELEASE.md"

      # Build the release APK using `github.run_number` for `versionCode` so
      # every CI build gets a higher version number automatically. Signing
      # uses the Play upload keystore when configured above, otherwise
      # Flutter's debug signing config (`android/app/build.gradle.kts`).
      - name: Build release APK
        # Emit key Gradle/Dart error lines as GitHub annotations just like the
        # test step above.
        shell: bash
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} \
            > /tmp/build.log 2>&1
          status=$?
          python3 tools/annotate_ci.py /tmp/build.log build
          tail -n 120 /tmp/build.log
          exit $status

      # Build the Play Store AAB (only when Play signing is configured).
      # Play Console requires an AAB; the APK above remains for sideloading.
      - name: Build release AAB (Play Store)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set +e
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            > /tmp/build-aab.log 2>&1
          status=$?
          python3 tools/annotate_ci.py /tmp/build-aab.log build
          tail -n 120 /tmp/build-aab.log
          exit $status

      # Upload the full build logs whenever a build step fails since GitHub
      # annotations are capped in length.
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /tmp/build.log
            /tmp/build-aab.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB as a build artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      # Runs only when a "vX.Y.Z" tag is pushed.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

      # Attach the Play AAB to the same GitHub Release when it was built.
      - name: Attach AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/bundle/release/app-release.aab
