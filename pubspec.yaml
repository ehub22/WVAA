name: westview_app
description: "Student-built Westview High School app for bell schedules, calendars, newsletters, publications, and daily lunch menus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # Localized Material/Cupertino widget strings (like "Back", selection menus,
  # and date pickers) for en/es/zh/tl. Our own app strings live in
  # lib/l10n/strings.dart.
  flutter_localizations:
    sdk: flutter

  flutter_timer_countdown: ^1.0.7
  webview_flutter: ^4.13.0
  simple_pip_mode: ^1.1.0
  webview_flutter_wkwebview: ^3.23.6
  http: ^1.6.0
  scrollable_positioned_list: ^0.3.8
  intl: ^0.20.2
  # Keep this pinned at 2.4.7 because 2.5.0 requires Flutter 3.44+ and renames
  # the Android Kotlin package to `com.istornz.live_activities`, which breaks
  # CustomLiveActivityManager.kt until both are updated together.
  live_activities: 2.4.7
  permission_handler: ^12.0.1
  home_widget: ^0.9.3
  shared_preferences: ^2.5.3
  # Opens external dialer, SMS, mail, and browser links from the Get help tab
  # so the app never handles calls or messages itself.
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only: generates launcher icons, never shipped in the app.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
