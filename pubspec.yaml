name: westview_app
description: "Westview High School companion app — schedules, calendars, newsletters, publications, and lunch menu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_timer_countdown: ^1.0.7
  timer_builder: ^2.0.0
  webview_flutter: ^4.13.0
  flutter_launcher_icons: ^0.14.4
  simple_pip_mode: ^1.1.0
  webview_flutter_wkwebview: ^3.23.6
  http: ^1.6.0
  scrollable_positioned_list: ^0.3.8
  intl: ^0.20.2
  # Pinned at 2.4.7 because 2.5.0 requires Flutter 3.44+ and renames the
  # Android plugin package, which would break the CustomLiveActivityManager
  # import. Upgrade deliberately after testing against the new package name
  # (`com.istornz.live_activities`).
  live_activities: 2.4.7
  permission_handler: ^12.0.1
  home_widget: ^0.9.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
