name: westview_app
description: Westview High School companion app — schedules, newsletters, publications, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  adaptive_platform_ui: ^0.1.100
  flutter_timer_countdown: ^1.0.7
  webview_flutter: ^4.13.0
  simple_pip_mode: ^1.1.0
  webview_flutter_wkwebview: ^3.23.6
  http: ^1.6.0
  scrollable_positioned_list: ^0.3.8
  live_activities: ^2.4.6
  permission_handler: ^12.0.1
  home_widget: ^0.9.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
